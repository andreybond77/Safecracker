<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Safecracker</title>
  <link rel="stylesheet" href="../style/common.css">
  <link rel="stylesheet" href="../style/game.css">
</head>
<body>
  <div class="app-shell">
    <div class="game">
      <!-- Кнопка звука СЛЕВА -->
      <button id="soundToggleBtn" class="circle-btn top-left sound-btn" aria-label="Выключить звук">🔊</button>
      <!-- Кнопка выхода СПРАВА -->
      <a href="menu.html" id="exitMenuBtn" class="circle-btn top-right exit-btn" aria-label="В меню">✕</a>

      <!-- Панели с цифрами -->
      <div class="panels">
        <div class="panel">
          <div class="target-digits" id="targetDigits"></div>
        </div>
        <div class="panel">
          <div class="target-digits active-digits" id="activeDigits"></div>
        </div>
      </div>

      <header class="header">
        <div class="side-panel">
          <span class="side-label">Время</span>
          <span class="side-value" id="timerValue">00:00</span>
        </div>
        <div class="side-panel">
          <span class="side-label">Ходы</span>
          <span class="side-value" id="movesCount">0</span>
        </div>
      </header>

      <!-- Поле с SVG и кнопками -->
      <div class="field-wrapper" id="fieldWrapper">
        <svg id="field" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet"></svg>
        
        <!-- Кнопки управления (координаты рассчитает JS) -->
        <button class="cross-btn ring-btn" id="rotateMechCW" data-angle="30" aria-label="Поворот механизма по часовой">👉🏿</button>
        
        <!-- Заменили ⟳ на эмодзи руки -->
        <button class="cross-btn ring-btn" id="rotateCCW" data-angle="150" aria-label="Вращение против часовой">
          <span class="mirrored-emoji">🤏🏿</span>
        </button>
        
        <button class="cross-btn ring-btn" id="restartCrossBtn" data-angle="180" aria-label="Начать заново">✋🏿</button>
        
        <!-- Заменили ⟲ на зеркальную руку -->
        <button class="cross-btn ring-btn" id="rotateCW" data-angle="210" aria-label="Вращение по часовой">🤏🏿</button>
        
        <button class="cross-btn ring-btn" id="rotateMechCCW" data-angle="330" aria-label="Поворот механизма против часовой">👈🏿</button>
      </div>

      <div class="status" id="status">Тащите солнечную шестерёнку в нужную позицию</div>
    </div>
  </div>

  <script src="../script/game.js"></script>
</body>
</html>
